services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: phishshield
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: phishshield_sales
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - sales_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phishshield -d phishshield_sales"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  sales_data:
